name: Retry Fetch News

on:
  workflow_run:
    workflows: ["Fetch News (4x daily)"]
    types: [completed]

jobs:
  rerun:
    # Disabled 2026-09-06. This exists for runner-acquisition failures, which a
    # re-run does fix. It cannot fix a depleted billing account, and while all
    # three LLM providers are out of credit it was turning every failure into two
    # runs and two notification emails: 17 failures became 40 retry runs in four
    # days. Re-enable by restoring the conclusion check below.
    if: >-
      false &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-run failed fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh run rerun ${{ github.event.workflow_run.id }}
