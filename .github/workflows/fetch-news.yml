name: Fetch News (4x daily)

on:
  schedule:
    # Gap-filler on the ODD hours at :37, offset from Vercel Cron's every-2h on the
    # even hours at :00. Two independent schedulers, so the feed keeps moving when
    # either one misses, and combined they land a fetch roughly hourly.
    #
    # This used to be "0 */2 * * *" and was MEASURED on 2026-10-02 delivering ~4
    # runs a day instead of 12 (observed gaps: 5.5h, 7.8h, 5.8h, 8.5h, 7.25h).
    # GitHub runs scheduled workflows on a best-effort queue and sheds them under
    # load, and the top of the hour is where every cron on the platform piles up,
    # so ":00" was the worst possible minute to ask for. Hence :37. GitHub can
    # still drop these, which is precisely why it is no longer the primary.
    #
    # Frequent runs are cheap, not expensive: source_url is UNIQUE, so a run an
    # hour later only summarises genuinely new items. Smaller batches also keep
    # each run well clear of the 800s function ceiling.
    - cron: "37 1-23/2 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger news fetch
        run: |
          set -euo pipefail

          curl -f -s -L -X GET \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 900 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://kapyn.app/api/news/fetch" \
            -o response.json

          jq . response.json

          # A 200 is not success, and neither is "some of it worked". Gemini's
          # credits ran out on ~2026-08-11 and every run stayed green for eleven
          # days while the feed froze, because nothing checked the body. The
          # weaker version of the same bug survived that fix: this step only
          # failed when inserted was 0, so the measured 2026-10-02 run that
          # inserted 100 and dropped 46 also exited 0 and emailed nobody. The
          # route now returns a health verdict; gate on it.
          status=$(jq -r '.health.status // "unknown"' response.json)
          drop_rate=$(jq -r '.health.dropRate // 0' response.json)
          attempted=$(jq -r '.health.attempted // 0' response.json)
          inserted=$(jq -r '.inserted // 0' response.json)
          llm_failed=$(jq -r '.llmFailed // 0' response.json)
          llm_error=$(jq -r '.llmError // "none"' response.json)

          echo "status=$status  inserted=$inserted  llmFailed=$llm_failed  attempted=$attempted  dropRate=$drop_rate"
          echo "providers used:    $(jq -c '.health.providersUsed // {}' response.json)"
          echo "provider attempts: $(jq -c '.health.providerAttempts // {}' response.json)"

          # A provider configured in code but skipped for a missing env var is a
          # deployment problem and silent otherwise: absent from both the used and
          # the dead list, which is how zai-glm vanished on run 37073036239.
          skipped=$(jq -c '.health.providersSkipped // {}' response.json)
          if [ "$skipped" != "{}" ]; then
            echo "::warning title=Provider not configured::$skipped"
          fi

          # Why each dead provider died. deadProviders named who, never why.
          errs=$(jq -c '.health.providerErrors // {}' response.json)
          if [ "$errs" != "{}" ]; then
            echo "::warning title=Provider errors::$errs"
          fi

          case "$status" in
            down)
              echo "::error title=Ingestion down::Nothing summarised out of ${attempted}. First error: ${llm_error}"
              exit 1
              ;;
            degraded)
              echo "::error title=Ingestion degraded::Dropped ${llm_failed}/${attempted} (${drop_rate}). First error: ${llm_error}"
              exit 1
              ;;
            ok)
              if [ "$llm_failed" -gt 0 ]; then
                echo "::warning::${llm_failed}/${attempted} dropped, under the alert threshold."
              fi
              echo "Ingestion healthy: ${inserted} inserted."
              ;;
            *)
              echo "::error title=No health verdict::Response had no .health block, so this deploy predates the health check or the body changed shape."
              exit 1
              ;;
          esac
